<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Revoke Scanner</title>
<meta name=description content="See every authz permission your AtomOne wallet has given, and revoke all or some in one signature.">
<link rel=icon href="{{BASE}}assets/favicon-32.png">
<link rel=stylesheet href="{{BASE}}tools/tools.css">
<script id=payload type=application/json>{{NETJSON}}</script>
</head>
<body>
<div class=wrap>
  <div class=bar>
    <a class=mark href="{{BASE}}tools"><img src="{{BASE}}assets/gata.png" alt=""><span><b>Revoke scanner</b><small>{{NETNAME}}</small></span></a>
    <span class=sp></span>
    <span class=wal id=wal hidden></span>
    <button class=ibtn id=thbtn type=button aria-label="Day or night"><svg class=sun viewBox="0 0 24 24"><circle cx=12 cy=12 r=4 /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class=moon viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
  <div class=card id=gate><div class=gate><h1>Who can act for your wallet?</h1><div id=gatebox></div></div></div>
  <div class=card id=tool hidden>
    <div class="hero idle" id=hero>
      <div><b id=hn>0</b><em>grants given</em></div>
      <div class=r><b id=hs>0</b><em>selected</em></div>
      <div class=v><b id=hu>0</b><em>unknown</em></div>
    </div>
    <div class=stage id=stg style="margin-top:12px"><canvas id=cv></canvas><span class=tag id=stgtag>scanning</span></div>
    <div class=sel style="margin-top:12px"><span id=selnote>&nbsp;</span><span class=sp></span><button class=lnk type=button id=selall>Select all</button><button class=lnk type=button id=selnone>None</button></div>
    <div class=rows id=rows></div>
    <div class=sel style="margin-top:14px"><span>Given to you</span></div>
    <div class=rows id=rrows></div>
    <div class=foot>
      <div class=fee><span id=fee>&nbsp;</span><span class=step id=step>&nbsp;</span></div>
      <button class="btn red" id=go type=button disabled>Revoke</button>
    </div>
  </div>
  <div class=card id=done hidden><div class=done><b id=donen>Revoked</b><span id=donetx></span><a id=donelink href="#" target=_blank rel=noopener>view transaction</a><button class="btn sm" id=again type=button>Scan again</button></div></div>
</div>
<script src="{{BASE}}tx.js"></script>
<script src="{{BASE}}tools/tools.js"></script>
<script src="{{BASE}}tools/revoke.js"></script>
</body>
</html>
