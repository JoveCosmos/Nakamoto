<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Fee Saver</title>
<meta name=description content="Send ATONE or PHOTON to one or many addresses in one signature, at the chain's own fee.">
<link rel=icon href="{{BASE}}assets/favicon-32.png">
<link rel=stylesheet href="{{BASE}}tools/tools.css">
<script id=payload type=application/json>{{NETJSON}}</script>
</head>
<body>
<div class=wrap>
  <div class=bar>
    <a class=mark href="{{BASE}}tools"><img src="{{BASE}}assets/gata.png" alt=""><span><b>Fee saver</b><small>{{NETNAME}}</small></span></a>
    <span class=sp></span>
    <span class=wal id=wal hidden></span>
    <button class=ibtn id=thbtn type=button aria-label="Day or night"><svg class=sun viewBox="0 0 24 24"><circle cx=12 cy=12 r=4 /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class=moon viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
  <div class=card id=gate><div class=gate><h1>Send at the chain's price</h1><div id=gatebox></div></div></div>
  <div class=card id=tool hidden>
    <div class="hero idle" id=hero>
      <div><b id=hf>0</b><em>fee, PHOTON</em></div>
      <div class=v><b id=hw>0</b><em>typical wallet fee</em></div>
      <div><b id=hp>0%</b><em>saved</em></div>
    </div>
    <div class=stage id=stg style="margin-top:12px"><canvas id=cv></canvas><span class=tag id=stgtag>0 recipients</span></div>
    <div class=tools style="margin-top:12px">
      <span class=seg id=den><button type=button data-d=uatone aria-pressed=true>ATONE</button><button type=button data-d=uphoton aria-pressed=false>PHOTON</button></span>
      <span class=seg id=mode><button type=button data-m=rows aria-pressed=true>Rows</button><button type=button data-m=paste aria-pressed=false>Paste</button></span>
      <span class=sp style="flex:1"></span>
      <span class=bal id=bal>&nbsp;</span>
    </div>
    <div class=rows id=rows style="margin-top:10px"></div>
    <textarea class=paste id=paste hidden placeholder="atone1... 12.5&#10;atone1... 3"></textarea>
    <div class=tools style="margin-top:8px"><button class="btn sm ghost" id=add type=button>+ recipient</button><input class=memo id=memo type=text maxlength=200 placeholder="memo (optional)" autocomplete=off spellcheck=false aria-label="Memo" style="flex:1 1 200px;width:auto"></div>
    <div class=foot>
      <div class=fee><span id=fee>&nbsp;</span><span class=step id=step>&nbsp;</span></div>
      <button class="btn go" id=go type=button disabled>Send</button>
    </div>
  </div>
  <div class=card id=done hidden><div class=done><b id=donen>Sent</b><span id=donetx></span><a id=donelink href="#" target=_blank rel=noopener>view transaction</a><button class="btn sm" id=again type=button>Send more</button></div></div>
</div>
<script src="{{BASE}}tx.js"></script>
<script src="{{BASE}}tools/tools.js"></script>
<script src="{{BASE}}tools/send.js"></script>
</body>
</html>
