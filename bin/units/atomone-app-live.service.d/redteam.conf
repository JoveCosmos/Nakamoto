# red team 2026-10-01: live.py writes OUT_DIR/live.json (live.json.tmp + rename, so it needs the dir), nothing
# else. Its own dir instead of the whole web root; web/live.json becomes a symlink to it. OUT_DIR is set on the
# command line because /etc/gata/atomone-app.env (shared with build/render) sets OUT_DIR=/srv/atomone-app/web
# and an EnvironmentFile beats Environment=
[Service]
ExecStart=
ExecStart=/usr/bin/env OUT_DIR=/srv/atomone-app/live/mainnet /usr/bin/python3 /srv/atomone-app/bin/live.py
ReadWritePaths=
ReadWritePaths=/srv/atomone-app/live/mainnet
