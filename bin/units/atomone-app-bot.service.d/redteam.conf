# red team 2026-10-01: the bot keeps RW on its dir (sqlite writes subs.db-journal beside subs.db) and on the
# state dir (bot.json and subs.backup.db, both .tmp + rename), but its own code is read only (a read-only bind
# mount: no write, no unlink, no rename over it), and so is the admin state
[Service]
ReadOnlyPaths=/srv/atomone-app/bot/bot.py
ReadOnlyPaths=-/srv/atomone-app/bot/__pycache__
ReadOnlyPaths=-/srv/atomone-app/state/admin
