<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=robots content="noindex,nofollow">
<title>Autopilot Admin</title>
<link rel=icon href="assets/favicon-32.png">
<style>
/* The operator console (2026-09-30): the layout of the design the operator was shown (a header, four count tiles, one
   list of wallets, each row its who, what, gain, when and one action), in the app's night look only. A view: the one
   action is Disable (Autopilot and Restake stop for that address) and Enable. No middle dots, no long dashes. */
:root{--bg:#06060c;--wc:#0e0e1d;--wh:#12122a;--wi:#0a0a16;--wbd:#232342;--wbd2:#34345c;--wt:#f0eef8;--ws:#c1bfdc;--wf:#8f8db4;
  --teal:#2bc8bd;--green:#2ee06a;--amber:#ffb02e;--violet:#b9b0ff;--red:#ff5a3c;
  --wsans:"Helvetica Neue",Helvetica,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --wmono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);background-image:radial-gradient(130% 62% at 50% 0%,#16162e 0%,#0a0a16 42%,var(--bg) 74%);
  color:var(--wt);font:14px/1.45 var(--wsans)}
button{font:inherit;color:inherit}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding:26px 32px 40px;display:flex;flex-direction:column;gap:20px}

/* header */
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.net{display:inline-flex;padding:3px;gap:2px;border-radius:10px;border:1px solid var(--wbd);background:var(--wi)}
.net button{height:28px;padding:0 12px;border:0;border-radius:7px;background:none;cursor:pointer;
  font-family:var(--wmono);font-size:11px;letter-spacing:.08em;color:var(--wf)}
.net button[aria-pressed=true]{background:var(--wh);color:var(--wt);box-shadow:inset 0 0 0 1px var(--wbd2)}
.net button:disabled{opacity:.35;cursor:not-allowed}
.sp{flex:1}
.who{font-family:var(--wmono);font-size:12px;color:var(--ws)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;min-width:96px;padding:0 16px;border-radius:10px;cursor:pointer;
  border:1px solid var(--wbd2);background:transparent;color:var(--wt);font-size:14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ws)}
.btn:disabled{opacity:.45;cursor:wait}
.btn.go{background:var(--teal);border-color:var(--teal);color:#04201d}
.btn.sm{height:30px;min-width:0;padding:0 12px;font-size:12.5px}

/* count tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--wc);border:1px solid var(--wbd);border-radius:12px;padding:14px 16px;min-width:0}
.tile em{display:block;font-style:normal;font-family:var(--wmono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--wf)}
.tile b{display:block;font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.tile small{display:block;font-size:12px;color:var(--ws);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.run b{color:var(--teal)}.tile.cool b{color:var(--amber)}.tile.low b{color:var(--amber)}

/* the list */
.list{background:var(--wc);border:1px solid var(--wbd);border-radius:16px;padding:20px 24px;display:flex;flex-direction:column}
.lh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--wbd)}
.lh h2{margin:0;font-size:17px;font-weight:600}
.lh small{font-size:13px;color:var(--ws)}
.tabs{display:inline-flex;padding:3px;gap:2px;border-radius:10px;border:1px solid var(--wbd);background:var(--wi)}
.tabs button{height:28px;padding:0 11px;border:0;border-radius:7px;background:none;cursor:pointer;color:var(--ws);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.tabs button i{font-style:normal;font-family:var(--wmono);font-size:10.5px;color:var(--wf)}
.tabs button[aria-selected=true]{background:var(--wh);color:var(--wt);box-shadow:inset 0 0 0 1px var(--wbd2)}
.row{display:grid;grid-template-columns:210px minmax(0,1fr) 150px 120px 120px;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--wbd)}
.row:last-child{border-bottom:0}
.who2{font-family:var(--wmono);font-size:13px;min-width:0}
.who2 small{display:block;font-family:var(--wsans);font-size:12px;color:var(--wf);margin-top:2px}
.what{display:flex;flex-direction:column;gap:2px;min-width:0}
.what b{font-size:15px;font-weight:500}
.what span{font-size:12.5px;color:var(--ws);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.what span.cool{color:var(--amber)}
.gain{font-family:var(--wmono);font-size:14px;color:var(--teal)}
.gain.dim,.when.dim{color:var(--wf)}
.when{font-size:13px;color:var(--ws)}
.act{display:flex;justify-content:flex-end}
.empty{padding:22px 0;color:var(--wf);font-size:13px}
.note{margin-top:14px;font-size:12.5px;color:var(--ws)}

/* validators */
.vals .row{grid-template-columns:minmax(0,1fr) auto;padding:12px 0}
.vals .what b{font-size:14px}
.tag{font-style:normal;font-family:var(--wmono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1px solid var(--wbd2);color:var(--wf);white-space:nowrap}
.tag.warn{border-color:var(--amber);color:var(--amber)}.tag.crit{border-color:var(--red);color:var(--red)}

/* the gate */
.gate{display:grid;place-items:center;min-height:60vh}
.gate .list{width:min(420px,100%);align-items:center;text-align:center;gap:12px;padding:28px}
.gate p{margin:0;color:var(--ws);font-size:13px}
.err{color:var(--red);font-size:12.5px;min-height:1em}

@media (max-width:980px){.wrap{padding:18px 16px 32px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}.row .gain,.row .when{grid-column:1}.row .what{grid-column:1 / -1}.row .act{grid-row:1;grid-column:2}}
</style>
</head>
<body>
<div class=wrap>
  <header>
    <h1>Autopilot admin</h1>
    <div class=net role=group aria-label=Network id=net><button type=button data-net=mainnet aria-pressed=true>MAINNET</button><button type=button data-net=testnet aria-pressed=false>TESTNET</button></div>
    <span class=sp></span>
    <span class=who id=who hidden></span>
    <button class="btn sm" type=button id=out hidden>Sign out</button>
  </header>
  <div id=gate class=gate>
    <div class=list>
      <h2 style="margin:0;font-size:20px">Operators only</h2>
      <p>Sign a one-time message with Keplr. Nothing is sent on chain.</p>
      <button class="btn go" type=button id=signin>Sign in with Keplr</button>
      <div class=err id=err></div>
    </div>
  </div>
  <div id=app hidden style="display:flex;flex-direction:column;gap:20px">
    <div class=tiles id=tiles></div>
    <section class=list>
      <div class=lh><h2>Wallets</h2><div class=tabs id=tabs role=tablist aria-label="Wallet state"></div><span class=sp></span><small id=when></small></div>
      <div id=rows></div>
      <div class=note>Autopilot and Restake run at 00:00 and 12:00 UTC. After a move a wallet cools down for 21 days, then comes back to Running. Disable stops both for that address until it is enabled.</div>
    </section>
    <section class="list vals">
      <div class=lh><h2>Validators</h2><span class=sp></span><small id=vwsub></small></div>
      <div id=vw></div>
    </section>
  </div>
</div>
<script src="admin.js"></script>
</body>
</html>
